name: Pruebas

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: estiba_wms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: estiba_wms_test
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar entorno
        run: cp .env.example .env

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip, gd
          coverage: none
          github-token: ${{ github.token }}

      - name: Obtener directorio de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php83-composer-

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
          COMPOSER_MAX_PARALLEL_HTTP: 4
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validar archivos de Composer
        run: composer validate --strict --no-check-publish

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Verificar scripts PowerShell cuando exista pwsh
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File scripts/windows/verificar-sintaxis.ps1
          else
            echo 'pwsh no disponible; verificación manual documentada.'
          fi

      - name: Probar coordinación de refrescos
        run: npm run test:js

      - name: Compilar interfaz tablet
        run: npm run design:check && npm run build

      - name: Exportar catálogo visual
        run: php artisan ui:catalogo

      - name: Verificar y exportar estructura de Oficina
        env:
          ESTIBA_EXPORTAR_UI_TESTS: '1'
        run: php artisan test --filter=EstructuraOficinaTest

      - name: Preparar Chromium para las pruebas de Oficina
        run: npx playwright install --with-deps chromium

      - name: Probar Materiales en el navegador
        run: npm run test:browser

      - name: Conservar catálogo visual para revisión
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: estiba-catalogo-visual
          path: |
            storage/app/ui/
            public/build/
          if-no-files-found: error
          retention-days: 14

      - name: Validar estilo
        run: vendor/bin/pint --test

      - name: Crear esquema limpio
        run: php artisan migrate:fresh --force

      - name: Ejecutar pruebas
        run: php artisan test --fail-on-warning

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias móviles
        run: npm ci

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Probar variantes y rendimiento del catálogo
        run: npm run test:catalog

      - name: Validar bundle Android
        run: npm run export:android

      - name: Validar bundle PDA
        run: npm run export:pda
