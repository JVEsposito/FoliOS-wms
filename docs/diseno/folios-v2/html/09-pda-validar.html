<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoliOS v2 · PDA: validar pallet (lámina de referencia)</title>
<!-- Lámina de referencia, no código de producción. Las cifras, nombres y folios son de ejemplo.
     En la aplicación las fuentes vienen autoalojadas (resources/css/folios-fonts.css). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=Azeret+Mono:wght@400..800&amp;display=swap">
<style>
body{margin:0}
.lb{font:600 13px/1.2 'Archivo',sans-serif;color:#9fbcc6}
.fld{display:flex;flex-direction:column;gap:6px}
.box{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;box-sizing:border-box;padding:8px 12px;border-radius:10px;border:1.5px solid #4d7484;background:#0f212b;font:600 16px/1.25 'Archivo',sans-serif;color:#e8f3f6}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg span{display:flex;align-items:center;justify-content:center;height:46px;border-radius:10px;font:700 15px/1 'Archivo',sans-serif}
</style>
</head>
<body>
<div style="width: 360px; height: 740px; box-sizing: border-box; background: #0f212b; color: #e8f3f6; font-family: 'Archivo', sans-serif; display: flex; flex-direction: column;">
  <header style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #0b1a22; border-bottom: 3px solid #7dbceb;">
    <button type="button" aria-label="Volver" style="width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid #3f6b7c; background: transparent; color: #e8f3f6; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e8f3f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></button>
    <div style="display: flex; flex-direction: column; gap: 2px;"><b style="font: 700 21px/1 'Azeret Mono', monospace; letter-spacing: -0.04em;">2610045987</b><span style="font-size: 13px; color: #9fbcc6;">Sin validaciones previas</span></div>
    <span style="margin-left: auto; font-size: 13px; color: #9fbcc6;">Línea 2</span>
  </header>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 14px;">
    <div class="fld"><span class="lb">Tipo de bulto</span>
      <div class="seg"><span style="background: #5fd3e6; color: #062530;">Pallet completo</span><span style="box-shadow: inset 0 0 0 1.5px #3f6b7c; color: #c5d9df;">Saldo</span></div>
    </div>
    <div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px;">
      <div class="fld"><span class="lb">Cajas</span><div class="box" style="font: 700 22px/1 'Azeret Mono', monospace;">84</div></div>
      <div class="fld"><span class="lb">Categoría</span><div class="box" style="color: #9fbcc6; font-weight: 500;">Seleccionar<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9fbcc6" stroke-width="2.5" aria-hidden="true"><path d="M6 9 L12 15 L18 9"></path></svg></div></div>
    </div>
    <div class="fld"><span class="lb">Artículo</span><div class="box"><span>Cereza Santina 2J<br><span style="font-size: 13px; font-weight: 500; color: #9fbcc6;">Caja 5 kg</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9fbcc6" stroke-width="2.5" aria-hidden="true"><path d="M6 9 L12 15 L18 9"></path></svg></div></div>
    <div class="fld"><span class="lb">Composición por CSG</span>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 12px; border-radius: 10px; background: #15303c;">
        <b style="font-size: 16px;">CSG 1802</b><b style="font: 700 16px/1 'Azeret Mono', monospace;">84 cajas</b>
        <span style="grid-column: 1 / -1; font-size: 13px; color: #9fbcc6;">Lote MP 2231, proceso de packing 0418</span>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #6fd6a0;"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5.5 L4 8.5 L9 1.5" stroke="#6fd6a0" stroke-width="2" fill="none"></path></svg>Combinación habilitada en el catálogo</span>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #f3b94f;"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="#f3b94f"></path></svg>Selecciona una categoría para aprobar.</p>
      <button type="button" disabled style="height: 60px; border: 0; border-radius: 12px; background: #24414f; color: #9fbcc6; font: 800 21px/1 'Archivo', sans-serif;">Aprobar</button>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button type="button" style="height: 52px; border-radius: 12px; border: 2px solid #7a5f22; background: #2c2716; color: #f3b94f; font: 700 16px/1 'Archivo', sans-serif; cursor: pointer;">Observar</button>
        <button type="button" style="height: 52px; border-radius: 12px; border: 2px solid #7d3f38; background: transparent; color: #ff8b7b; font: 700 15px/1.1 'Archivo', sans-serif; cursor: pointer;">Rechazo definitivo</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
